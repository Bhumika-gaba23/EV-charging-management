name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev libcurl4-openssl-dev libssl-dev
      - name: Build C++ API and domain tests
        run: |
          cmake -S . -B build-web-demo -DEV_BUILD_WEB_API=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web-demo -j2
      - name: Domain checks
        run: ctest --test-dir build-web-demo --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install simulator dependencies
        run: python -m pip install -r ocpp-simulator/requirements.txt
      - name: Customer API, persistence and simulator tests
        run: python tests/api/customer_integration.py
      - name: Phone sign-in and Razorpay checkout tests
        run: python tests/api/integrations_test.py
      - name: Operator dashboard access tests
        run: python tests/api/operator_auth_test.py

  web-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend logic tests
        run: node --test tests/web/demo.test.mjs tests/web/session-summary.test.mjs tests/web/discovery.test.mjs tests/web/preload.test.mjs

  render-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image Render deploys
        run: docker build -f deployment/Dockerfile -t pluggo-render .
