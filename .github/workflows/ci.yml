name: ci
on: [push, pull_request]
jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DEV_BUILD_WEB_API=ON -DBUILD_TESTING=ON
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
  flutter:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker build -f docker/api.Dockerfile .
      - run: docker build ocpp-simulator
