# Hosting template, not yet deployed. This configuration uses a paid persistent disk.
# Select deployment/render-persistent.yaml as the Blueprint path in Render.
services:
  - type: web
    name: pluggo-customer
    runtime: docker
    plan: starter
    numInstances: 1
    dockerfilePath: ./deployment/Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    autoDeployTrigger: off
    envVars:
      - key: CHARGEFLOW_CUSTOMER_DB
        value: /data/pluggo.sqlite3
      - key: CHARGEFLOW_COOKIE_SECURE
        value: "1"
      - key: PLUGGO_GATEWAY_KEY
        sync: false
      # Phone sign-in (Firebase Authentication). Leave unset to keep anonymous visitors.
      - key: PLUGGO_FIREBASE_PROJECT_ID
        sync: false
      - key: PLUGGO_FIREBASE_API_KEY
        sync: false
      - key: PLUGGO_FIREBASE_APP_ID
        sync: false
      # Operator dashboard: comma-separated phone numbers (+91…) allowed to sign in.
      # With Firebase on and this empty, nobody can open live operator data.
      - key: PLUGGO_OPERATOR_PHONES
        sync: false
      # Razorpay test or live keys. Leave unset to keep the zero-amount checkout.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Razorpay Dashboard → Webhooks secret for https://<host>/api/customer/razorpay/webhook
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Continuous SQLite backup (Litestream) to S3-compatible storage such as Cloudflare R2.
      # Leave unset to keep the database only on this instance.
      - key: PLUGGO_BACKUP_URL
        sync: false
      - key: PLUGGO_BACKUP_ENDPOINT
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
    disk:
      name: pluggo-customer-data
      mountPath: /data
      sizeGB: 1
