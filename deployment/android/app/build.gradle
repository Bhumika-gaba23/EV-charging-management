plugins { id 'com.android.application' }
android {
    namespace 'com.pluggo.preview'
    compileSdk 36
    defaultConfig {
        applicationId 'com.pluggo.preview'
        minSdk 26
        targetSdk 34
        versionCode 21
        versionName '2.5.0'
    }
    // Sign with both schemes. minSdk 26 lets the build drop v1 (JAR) signing, and some phone
    // makers' installers (OPPO/ColorOS, Vivo) then reject the APK as "package invalid".
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.car.app:app:1.4.0' // Pluggo on the car screen (Android Auto)
}
